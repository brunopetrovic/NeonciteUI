name: Isolate Featured Homepage Previews

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/product-excellence-phase-2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Replace global showcase import and self-delete
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/index.tsx')
          s = p.read_text()
          s = s.replace('import { SHOWCASES } from "@/registry/showcases";', 'import { FEATURED_SHOWCASES, FEATURED_SLUGS } from "@/registry/featured-showcases";')
          s = s.replace('REGISTRY.map((item) => {', 'FEATURED_SLUGS.map((slug) => REGISTRY.find((item) => item.slug === slug)!).map((item) => {')
          s = s.replace('REGISTRY.slice(0, 6).map((item) => {', 'FEATURED_SLUGS.map((slug) => REGISTRY.find((item) => item.slug === slug)!).map((item) => {')
          s = s.replace('const showcase = SHOWCASES[item.slug];', 'const showcase = FEATURED_SHOWCASES[item.slug];')
          s = s.replace('{showcase?.preview}', '{showcase}')
          p.write_text(s)
          PY
          rm .github/workflows/cleanup-featured-home.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx .github/workflows/cleanup-featured-home.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "perf: isolate homepage featured component bundle"
          git push origin HEAD:${{ github.head_ref }}
