name: Preview Deploy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 as of 2026-08-21

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 as of 2026-08-21
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/cli/package-lock.json
            packages/ui/package-lock.json

      - name: Use the lockfile npm version
        run: npm install --global npm@11.9.0

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix packages/cli
          npm ci --prefix packages/ui

      - name: Approve blocked postinstall scripts
        run: |
          npx npm-install-scripts approve esbuild 2>/dev/null \
            || npx install-scripts approve esbuild 2>/dev/null \
            || true

      - name: Build
        run: npm run build

      - name: Deploy preview Worker
        run: |
          npx wrangler deploy --config wrangler.deploy.jsonc \
            --name neoncite-ui-pr-${{ github.event.pull_request.number }}
