name: Format Phase 2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: format-phase-2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: github.head_ref == 'agent/product-excellence-phase-2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install formatter
        run: npm install --no-audit --no-fund

      - name: Format authored sources
        run: >-
          npx prettier --write
          "src/**/*.{ts,tsx,json,css}"
          "scripts/**/*.mjs"
          "tests/**/*.mjs"
          "packages/cli/src/**/*.ts"
          "package.json"

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts tests packages/cli/src package.json
          git commit -m "chore: format phase 2 sources"
          git push origin HEAD:${{ github.head_ref }}
