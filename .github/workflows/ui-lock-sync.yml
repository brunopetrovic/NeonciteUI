name: UI lock sync

on:
  push:
    branches: [chore/v0.3-hardening]

permissions:
  contents: write

concurrency:
  group: ui-lock-sync
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[ui-lock-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 as of 2026-08-21
        with:
          ref: chore/v0.3-hardening

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 as of 2026-08-21
        with:
          node-version: 22.13.0

      - name: Regenerate UI lockfile only
        run: npm install --prefix packages/ui --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ui/package-lock.json
          if git diff --cached --quiet; then
            echo "UI lockfile already synchronized"
          else
            git commit -m "chore: synchronize UI lockfile [ui-lock-sync]"
            git push origin HEAD:chore/v0.3-hardening
          fi
