name: Section 2 token sync

on:
  push:
    branches: [chore/v0.3-hardening]

permissions:
  contents: write

concurrency:
  group: section2-token-sync
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[section2-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 as of 2026-08-21
        with:
          ref: chore/v0.3-hardening

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 as of 2026-08-21
        with:
          node-version: 22.13.0

      - name: Apply audited replacements
        run: node scripts/apply-section2.mjs

      - name: Prove registry color and motion audit
        run: node scripts/validate-registry-style.mjs

      - name: Commit synchronized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/registry/ui src/components/blocks packages/ui/tokens.css
          if git diff --cached --quiet; then
            echo "No Section 2 changes to commit"
          else
            git commit -m "refactor: replace registry hardcoded colors [section2-sync]"
            git push origin HEAD:chore/v0.3-hardening
          fi
