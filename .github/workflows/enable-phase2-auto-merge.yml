name: Enable Phase 2 Auto Merge

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: github.head_ref == 'agent/product-excellence-phase-2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Enable auto-merge only after bootstrap automation is gone
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ ! -d tests/e2e/product.spec.ts-snapshots ]; then
            echo "Visual baselines are not ready."
            exit 0
          fi
          if [ -f .github/workflows/finalize-phase2.yml ]; then
            echo "Phase 2 finalizer has not cleaned the bootstrap workflows yet."
            exit 0
          fi

          rm .github/workflows/enable-phase2-auto-merge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/enable-phase2-auto-merge.yml
          git commit -m "ci: remove phase 2 auto-merge bootstrap"
          git push origin HEAD:${{ github.head_ref }}

          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --squash \
            --auto
