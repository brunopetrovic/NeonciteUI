name: Tighten Phase 2 Homepage

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/product-excellence-phase-2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Keep featured previews intentionally small and self-delete
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/index.tsx')
          s = p.read_text()
          s = s.replace('REGISTRY.map((item) => {', 'REGISTRY.slice(0, 6).map((item) => {')
          p.write_text(s)
          PY
          rm .github/workflows/cleanup-homepage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx .github/workflows/cleanup-homepage.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "perf: keep homepage previews intentionally featured"
          git push origin HEAD:${{ github.head_ref }}
