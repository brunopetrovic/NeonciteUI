name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            package.json
            packages/cli/package.json
            packages/ui/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Approve blocked postinstall scripts
        run: |
          npx npm-install-scripts approve esbuild 2>/dev/null \
            || npx install-scripts approve esbuild 2>/dev/null \
            || true

      - name: Build
        run: npm run build

      - name: Deploy
        run: npx wrangler deploy --config wrangler.deploy.jsonc
