name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Approve blocked postinstall scripts
        run: |
          npx npm-install-scripts approve esbuild 2>/dev/null \
            || npx install-scripts approve esbuild 2>/dev/null \
            || true

      - name: Build
        run: npm run build

      - name: Deploy
        run: npx wrangler deploy --config wrangler.deploy.jsonc
