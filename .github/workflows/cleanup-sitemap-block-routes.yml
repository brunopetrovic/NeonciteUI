name: Add Block Detail Routes to Sitemap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/product-excellence-phase-2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Include Block detail routes and self-delete
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/build-sitemap.mjs')
          s = p.read_text()
          if 'src/registry/blocks.json' not in s:
              s = s.replace('const EXTRA_ITEMS_PATH = path.join(ROOT, "src/registry/items-extra.json");', 'const EXTRA_ITEMS_PATH = path.join(ROOT, "src/registry/items-extra.json");\nconst BLOCKS_PATH = path.join(ROOT, "src/registry/blocks.json");')
              s = s.replace('const items = [', 'const blocks = JSON.parse(fs.readFileSync(BLOCKS_PATH, "utf8"));\nconst items = [')
              s = s.replace('const componentRoutes = items.map((item) => `/components/${item.slug}`);\nconst routes = [...new Set([...staticRoutes, ...componentRoutes])];', 'const componentRoutes = items.map((item) => `/components/${item.slug}`);\nconst blockRoutes = blocks.map((block) => `/blocks/${block.slug}`);\nconst routes = [...new Set([...staticRoutes, ...componentRoutes, ...blockRoutes])];')
          p.write_text(s)
          PY
          rm .github/workflows/cleanup-sitemap-block-routes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-sitemap.mjs .github/workflows/cleanup-sitemap-block-routes.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "seo: include Block detail routes in sitemap"
          git push origin HEAD:${{ github.head_ref }}
