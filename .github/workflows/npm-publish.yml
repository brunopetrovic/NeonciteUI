name: Publish to npm

# Manual release publishing for `neoncite` and `@neoncite/ui`.
#
# Preferred authentication: npm Trusted Publishing (OIDC) configured for this
# repository, workflow filename, and the `npm` GitHub Environment. npm detects
# OIDC before falling back to traditional tokens.
#
# Transitional fallback: NPM_TOKEN may remain configured in the `npm`
# environment until Trusted Publishing has been verified for both packages.
# Revoke the write token after OIDC is confirmed.
#
# Publishing is idempotent: if a version is already on npm the step is skipped.
# A successful real publish also creates the matching GitHub Release if missing.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (validate, build and pack; do not publish)"
        type: boolean
        default: false

permissions:
  contents: write # create the coordinated GitHub release after npm verification
  id-token: write # npm Trusted Publishing / provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 as of 2026-08-21

      - name: Require main for publication
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "Real releases must be dispatched from main; got ${GITHUB_REF}." >&2
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 as of 2026-08-21
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Use release npm version
        run: npm install --global npm@11.15.0

      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit release dependency graph
        run: npm audit --audit-level=moderate

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full validation gate
        run: npm run validate

      - name: Install CLI dependencies
        run: npm ci --prefix packages/cli --no-audit --no-fund

      - name: Audit CLI package graph
        run: npm audit --prefix packages/cli --audit-level=moderate

      - name: Install UI package dependencies
        run: npm ci --prefix packages/ui --no-audit --no-fund

      - name: Audit UI package graph
        run: npm audit --prefix packages/ui --audit-level=moderate

      - name: Validate version and release parity
        run: node scripts/validate-version-parity.mjs

      - name: Build @neoncite/ui package
        run: npm --prefix packages/ui run build

      - name: Build CLI package
        run: npm run build --prefix packages/cli

      - name: Pack CLI
        working-directory: packages/cli
        run: npm pack --dry-run=false && ls -la *.tgz

      - name: Pack @neoncite/ui
        working-directory: packages/ui
        run: npm pack --dry-run=false && ls -la *.tgz

      - name: Publish neoncite CLI
        if: ${{ !inputs.dry_run }}
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view neoncite@${VERSION} version >/dev/null 2>&1; then
            echo "neoncite@${VERSION} already published — skipping"
          else
            npm publish --provenance --access public
          fi

      - name: Publish @neoncite/ui
        if: ${{ !inputs.dry_run }}
        working-directory: packages/ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view @neoncite/ui@${VERSION} version >/dev/null 2>&1; then
            echo "@neoncite/ui@${VERSION} already published — skipping"
          else
            npm publish --provenance --access public
          fi

      - name: Verify published versions
        if: ${{ !inputs.dry_run }}
        run: |
          V=$(node -p "require('./packages/cli/package.json').version")
          test "$(npm view neoncite@${V} version)" = "${V}"
          test "$(npm view @neoncite/ui@${V} version)" = "${V}"
          echo "✓ both npm packages live at ${V}"

      - name: Create coordinated GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./packages/cli/package.json').version")
          if gh release view "v${V}" >/dev/null 2>&1; then
            echo "GitHub release v${V} already exists — skipping"
          else
            gh release create "v${V}" \
              --target "$GITHUB_SHA" \
              --title "Neoncite/UI v${V}" \
              --generate-notes
          fi

      - name: Release follow-up
        if: ${{ !inputs.dry_run }}
        run: |
          echo "npm and GitHub release verification passed."
          echo "Finalize src/lib/release-status.ts so PUBLIC_VERSION equals SOURCE_VERSION and SOURCE_IS_PUBLIC=true, then deploy main."
