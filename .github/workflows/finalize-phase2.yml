name: Finalize Phase 2 CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/product-excellence-phase-2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Finalize only after visual baselines exist
        shell: bash
        run: |
          if [ ! -d tests/e2e/product.spec.ts-snapshots ]; then
            echo "Visual baselines not established yet; leaving bootstrap CI in place."
            exit 0
          fi

          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
              branches: [main]
            pull_request:

          permissions:
            contents: read

          concurrency:
            group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          jobs:
            validate:
              runs-on: ubuntu-latest
              timeout-minutes: 45
              steps:
                - name: Checkout
                  uses: actions/checkout@v7

                - name: Set up Node
                  uses: actions/setup-node@v6
                  with:
                    node-version: 22.13.0
                    cache: npm
                    cache-dependency-path: |
                      package.json
                      packages/cli/package.json
                      packages/ui/package.json

                - name: Install root dependencies
                  run: npm install --no-audit --no-fund

                - name: Install CLI dependencies
                  run: npm install --prefix packages/cli --no-audit --no-fund

                - name: Install UI package dependencies
                  run: npm install --prefix packages/ui --no-audit --no-fund

                - name: Validate release version parity
                  run: node scripts/validate-version-parity.mjs

                - name: Validate registry dependencies
                  run: npm run validate:registry

                - name: Validate generated artifacts
                  run: npm run validate:generated

                - name: Typecheck
                  run: npm run typecheck

                - name: Lint
                  run: npm run lint

                - name: Test
                  run: npm run test

                - name: Build documentation site
                  run: npm run build

                - name: Build CLI package
                  run: npm run build --prefix packages/cli

                - name: Build UI package
                  run: npm run build --prefix packages/ui

                - name: Fresh Vite + Tailwind v4 clean-room install
                  run: node scripts/clean-room-vite.mjs

                - name: Install Chromium
                  run: npx playwright install --with-deps chromium

                - name: Browser accessibility and visual regression
                  run: npm run test:e2e
          YAML

          rm -f .github/workflows/format-phase2.yml
          rm -f .github/workflows/cleanup-phase2.yml
          rm -f .github/workflows/finalize-phase2.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml .github/workflows/format-phase2.yml .github/workflows/cleanup-phase2.yml .github/workflows/finalize-phase2.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: finalize read-only phase 2 gates"
          git push origin HEAD:${{ github.head_ref }}
