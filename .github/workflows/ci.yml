name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            package.json
            packages/cli/package.json
            packages/ui/package.json

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Format Phase 2 authored sources once
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/product-excellence-phase-2'
        shell: bash
        run: |
          npx prettier --write \
            "src/**/*.{ts,tsx,json,css}" \
            "scripts/**/*.mjs" \
            "tests/**/*.{ts,mjs}" \
            "packages/cli/src/**/*.ts" \
            "package.json" \
            "playwright.config.ts"
          if git diff --quiet; then
            echo "No formatting changes required."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src scripts tests packages/cli/src package.json playwright.config.ts
            git commit -m "chore: format phase 2 sources"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install CLI dependencies
        run: npm install --prefix packages/cli --no-audit --no-fund

      - name: Install UI package dependencies
        run: npm install --prefix packages/ui --no-audit --no-fund

      - name: Validate release version parity
        run: node scripts/validate-version-parity.mjs

      - name: Validate registry dependencies
        run: npm run validate:registry

      - name: Validate generated artifacts
        run: npm run validate:generated

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build documentation site
        run: npm run build

      - name: Build CLI package
        run: npm run build --prefix packages/cli

      - name: Build UI package
        run: npm run build --prefix packages/ui

      - name: Fresh Vite + Tailwind v4 clean-room install
        run: node scripts/clean-room-vite.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Bootstrap visual baselines once
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/product-excellence-phase-2'
        shell: bash
        run: |
          if [ -d tests/e2e/product.spec.ts-snapshots ]; then
            echo "Visual baselines already exist."
            exit 0
          fi
          npx playwright test --update-snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/product.spec.ts-snapshots
          git commit -m "test: establish visual regression baselines"
          git push origin HEAD:${{ github.head_ref }}

      - name: Browser accessibility and visual regression
        run: npm run test:e2e
