name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 as of 2026-08-21
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 as of 2026-08-21
        with:
          node-version: 22.13.0

      - name: Apply remaining v0.3 materialization
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/v0.3-hardening'
        run: |
          node scripts/apply-v03-config.mjs
          node scripts/patch-cli-integrity.mjs

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Install CLI dependencies
        run: npm install --prefix packages/cli --no-audit --no-fund

      - name: Install UI package dependencies
        run: npm install --prefix packages/ui --no-audit --no-fund

      - name: Format v0.3 sources and metadata
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/v0.3-hardening'
        run: >-
          npx prettier --write --ignore-unknown
          README.md CONTRIBUTING.md CHANGELOG.md package.json tsconfig.json eslint.config.js
          components.json metadata.json renovate.json .github src/registry src/routes tests scripts
          packages/cli/src packages/ui/src packages/ui/package.json packages/ui/tokens.css

      - name: Generate registry and package artifacts
        run: npm run build:dist

      - name: Build site and route tree
        run: npm run build

      - name: Validate registry and accessibility audits
        run: npm run validate:registry

      - name: Validate generated artifacts
        run: npm run validate:generated

      - name: Validate public claims and release parity
        run: |
          node scripts/validate-public-claims.mjs
          node scripts/validate-version-parity.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Registry tests
        run: npm run test

      - name: Component unit tests
        run: npm run test:unit

      - name: Core bundle budget
        run: npm run check:bundle

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser accessibility and visual regression
        run: npm run test:e2e

      - name: Analyze production bundle
        run: npm run build:analyze

      - name: Commit validated generated and formatted changes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/v0.3-hardening'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No convergence changes to commit"
          else
            git commit -m "chore: converge v0.3 validation artifacts [v03-converge]"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
