name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 as of 2026-08-21
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 as of 2026-08-21
        with:
          node-version: 22.13.0

      - name: 1 · Install root dependencies
        run: npm ci

      - name: 2 · Install CLI dependencies
        run: npm ci --prefix packages/cli

      - name: 3 · Install UI package dependencies
        run: npm ci --prefix packages/ui

      - name: 4 · Install Chromium
        run: npx playwright install --with-deps chromium

      - name: 5 · Validate application and registry
        run: npm run validate

      - name: 6 · Build CLI
        run: npm run build --prefix packages/cli

      - name: 7 · Build UI package
        run: npm run build --prefix packages/ui

      - name: 8 · Analyze production bundle
        run: npm run build:analyze

      - name: 9 · Verify generated worktree is clean
        run: git diff --exit-code

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 as of 2026-08-21
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
