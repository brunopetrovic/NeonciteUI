name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            package.json
            packages/cli/package.json
            packages/ui/package.json

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Install CLI dependencies
        run: npm install --prefix packages/cli --no-audit --no-fund

      - name: Install UI package dependencies
        run: npm install --prefix packages/ui --no-audit --no-fund

      - name: Validate registry dependencies
        run: npm run validate:registry

      - name: Validate generated artifacts
        run: npm run validate:generated

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build documentation site
        run: npm run build

      - name: Build CLI package
        run: npm run build --prefix packages/cli

      - name: Build UI package
        run: npm run build --prefix packages/ui
