name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 as of 2026-08-21
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 as of 2026-08-21
        with:
          node-version: 22.13.0

      - name: Apply v0.3 dependency and config hardening
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/v0.3-hardening'
        run: |
          node scripts/apply-v03-config.mjs
          node scripts/patch-cli-integrity.mjs

      - name: Install and lock root dependencies
        run: npm install --no-audit --no-fund

      - name: Generate registry and UI package
        run: npm run build:dist

      - name: Install and lock CLI dependencies
        run: npm install --prefix packages/cli --no-audit --no-fund

      - name: Install and lock UI package dependencies
        run: npm install --prefix packages/ui --no-audit --no-fund

      - name: Format materialized v0.3 changes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/v0.3-hardening'
        run: npx prettier --write package.json tsconfig.json eslint.config.js components.json metadata.json src/registry/items.json src/registry/items-extra.json packages/cli/src/index.ts packages/ui/package.json packages/ui/src public/r scripts/build-registry.mjs scripts/build-package.mjs scripts/check-core-bundle.mjs

      - name: Prove dependency, registry, and bundle policies
        run: |
          npm run validate:registry
          npm run check:bundle
          node scripts/validate-version-parity.mjs

      - name: Commit materialized dependency and registry changes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/v0.3-hardening'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No dependency/config changes to commit"
          else
            git commit -m "chore: materialize v0.3 dependency and registry hardening [config-sync]"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Validate generated artifacts
        run: npm run validate:generated

      - name: Validate public claims
        run: node scripts/validate-public-claims.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
