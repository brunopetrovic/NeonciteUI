name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 as of 2026-08-21
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 as of 2026-08-21
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            package.json
            packages/cli/package.json
            packages/ui/package.json

      - name: Apply Section 2 token migration
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/v0.3-hardening'
        run: node scripts/apply-section2.mjs

      - name: Prove Section 2 registry audit
        run: node scripts/validate-registry-style.mjs

      - name: Commit audited Section 2 migration
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/v0.3-hardening'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/registry/ui src/components/blocks packages/ui/tokens.css
          if git diff --cached --quiet; then
            echo "No Section 2 changes to commit"
          else
            git commit -m "refactor: replace registry hardcoded colors [section2-sync]"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Install CLI dependencies
        run: npm install --prefix packages/cli --no-audit --no-fund

      - name: Install UI package dependencies
        run: npm install --prefix packages/ui --no-audit --no-fund

      - name: Validate release version parity
        run: node scripts/validate-version-parity.mjs

      - name: Validate registry dependencies
        run: npm run validate:registry

      - name: Validate generated artifacts
        run: npm run validate:generated

      - name: Validate public claims
        run: node scripts/validate-public-claims.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build documentation site
        run: npm run build

      - name: Build CLI package
        run: npm run build --prefix packages/cli

      - name: Build UI package
        run: npm run build --prefix packages/ui

      - name: Fresh Vite + Tailwind v4 clean-room install
        run: node scripts/clean-room-vite.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser accessibility and visual regression
        run: npm run test:e2e
