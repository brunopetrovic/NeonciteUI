name: Cleanup Phase 2 Composition

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/product-excellence-phase-2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Apply narrow source cleanup and self-delete
        shell: bash
        run: |
          sed -i 's/accent="pink"/accent="green"/g; s/accent="purple"/accent="cyan"/g' src/components/blocks/DashboardShell.tsx
          sed -i '/^  Activity,$/d; /^  Search,$/d; /^  ShieldCheck,$/d; /^  Wifi,$/d' src/registry/showcases/phase2.tsx
          rm .github/workflows/cleanup-composition.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/blocks/DashboardShell.tsx src/registry/showcases/phase2.tsx .github/workflows/cleanup-composition.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: tighten phase 2 composition contracts"
          git push origin HEAD:${{ github.head_ref }}
