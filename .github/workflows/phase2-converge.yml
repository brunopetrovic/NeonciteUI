name: Phase 2 Converge

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  converge:
    if: github.head_ref == 'agent/product-excellence-phase-2'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            package.json
            packages/cli/package.json
            packages/ui/package.json

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --prefix packages/cli --no-audit --no-fund
          npm install --prefix packages/ui --no-audit --no-fund

      - name: Normalize authored formatting
        id: format
        shell: bash
        run: |
          npx prettier --write \
            "src/**/*.{ts,tsx,json,css}" \
            "scripts/**/*.mjs" \
            "tests/**/*.{ts,mjs}" \
            "packages/cli/src/**/*.ts" \
            "package.json" \
            "playwright.config.ts"
          git add src scripts tests packages/cli/src package.json playwright.config.ts
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: format phase 2 sources"
            git push origin HEAD:${{ github.head_ref }}
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop after formatting commit
        if: steps.format.outputs.changed == 'true'
        run: exit 0

      - name: Generate distribution artifacts
        if: steps.format.outputs.changed != 'true'
        id: generated
        shell: bash
        run: |
          npm run build:dist
          npm run build:sitemap
          git add public/r public/sitemap.xml packages/ui/src packages/ui/package.json packages/ui/tokens.css
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: sync generated distribution artifacts"
            git push origin HEAD:${{ github.head_ref }}
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop after generated-artifact commit
        if: steps.generated.outputs.changed == 'true'
        run: exit 0

      - name: Validate release version parity
        if: steps.generated.outputs.changed != 'true'
        run: node scripts/validate-version-parity.mjs

      - name: Validate registry dependencies
        if: steps.generated.outputs.changed != 'true'
        run: npm run validate:registry

      - name: Validate generated artifacts
        if: steps.generated.outputs.changed != 'true'
        run: npm run validate:generated

      - name: Validate public claims
        if: steps.generated.outputs.changed != 'true'
        run: node scripts/validate-public-claims.mjs

      - name: Typecheck
        if: steps.generated.outputs.changed != 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.generated.outputs.changed != 'true'
        run: npm run lint

      - name: Unit and registry tests
        if: steps.generated.outputs.changed != 'true'
        run: npm run test

      - name: Build documentation site
        if: steps.generated.outputs.changed != 'true'
        run: npm run build

      - name: Build CLI package
        if: steps.generated.outputs.changed != 'true'
        run: npm run build --prefix packages/cli

      - name: Build UI package
        if: steps.generated.outputs.changed != 'true'
        run: npm run build --prefix packages/ui

      - name: Fresh Vite clean-room install
        if: steps.generated.outputs.changed != 'true'
        run: node scripts/clean-room-vite.mjs

      - name: Install Chromium
        if: steps.generated.outputs.changed != 'true'
        run: npx playwright install --with-deps chromium

      - name: Establish visual baselines if missing
        if: steps.generated.outputs.changed != 'true'
        id: baselines
        shell: bash
        run: |
          if [ -d tests/e2e/product.spec.ts-snapshots ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx playwright test --update-snapshots
          git add tests/e2e/product.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "test: establish visual regression baselines"
            git push origin HEAD:${{ github.head_ref }}
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop after visual-baseline commit
        if: steps.baselines.outputs.changed == 'true'
        run: exit 0

      - name: Browser accessibility and visual regression
        if: steps.baselines.outputs.changed != 'true' && steps.generated.outputs.changed != 'true'
        run: npm run test:e2e

      - name: Install permanent read-only CI and remove bootstrap automation
        if: steps.baselines.outputs.changed != 'true' && steps.generated.outputs.changed != 'true'
        shell: bash
        run: |
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
              branches: [main]
            pull_request:

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              timeout-minutes: 45
              steps:
                - name: Checkout
                  uses: actions/checkout@v7

                - name: Set up Node
                  uses: actions/setup-node@v6
                  with:
                    node-version: 22.13.0
                    cache: npm
                    cache-dependency-path: |
                      package.json
                      packages/cli/package.json
                      packages/ui/package.json

                - name: Install root dependencies
                  run: npm install --no-audit --no-fund

                - name: Install CLI dependencies
                  run: npm install --prefix packages/cli --no-audit --no-fund

                - name: Install UI package dependencies
                  run: npm install --prefix packages/ui --no-audit --no-fund

                - name: Validate release version parity
                  run: node scripts/validate-version-parity.mjs

                - name: Validate registry dependencies
                  run: npm run validate:registry

                - name: Validate generated artifacts
                  run: npm run validate:generated

                - name: Validate public claims
                  run: node scripts/validate-public-claims.mjs

                - name: Typecheck
                  run: npm run typecheck

                - name: Lint
                  run: npm run lint

                - name: Test
                  run: npm run test

                - name: Build documentation site
                  run: npm run build

                - name: Build CLI package
                  run: npm run build --prefix packages/cli

                - name: Build UI package
                  run: npm run build --prefix packages/ui

                - name: Fresh Vite + Tailwind v4 clean-room install
                  run: node scripts/clean-room-vite.mjs

                - name: Install Chromium
                  run: npx playwright install --with-deps chromium

                - name: Browser accessibility and visual regression
                  run: npm run test:e2e
          YAML

          rm -f \
            .github/workflows/format-phase2.yml \
            .github/workflows/cleanup-phase2.yml \
            .github/workflows/cleanup-composition.yml \
            .github/workflows/cleanup-cleanroom.yml \
            .github/workflows/cleanup-homepage.yml \
            .github/workflows/finalize-phase2.yml \
            .github/workflows/enable-phase2-auto-merge.yml \
            .github/workflows/cleanup-phase2-composition.yml \
            .github/workflows/phase2-converge.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m "ci: finalize permanent read-only release gates"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Mark PR ready and merge validated Phase 2
        if: steps.baselines.outputs.changed != 'true' && steps.generated.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr ready "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" || true
          gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --squash --auto || \
            gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --squash
