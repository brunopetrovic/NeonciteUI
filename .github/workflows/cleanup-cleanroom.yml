name: Tighten Clean Room Fixture

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/product-excellence-phase-2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Use the public telemetry Block fixture and self-delete
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/clean-room-vite.mjs')
          s = p.read_text()
          s = s.replace('"hero-console",', '"telemetry-dashboard",')
          s = s.replace('import { HeroBrutal } from "./components/neoncite/blocks/hero-console";', 'import { TelemetryDashboard } from "./components/neoncite/blocks/telemetry-dashboard";')
          s = s.replace('<HeroBrutal />', '<TelemetryDashboard />')
          p.write_text(s)
          PY
          rm .github/workflows/cleanup-cleanroom.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/clean-room-vite.mjs .github/workflows/cleanup-cleanroom.yml
          git commit -m "test: use telemetry dashboard clean-room fixture"
          git push origin HEAD:${{ github.head_ref }}
