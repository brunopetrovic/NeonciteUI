name: Feature request
description: Propose a component, Block, theme, API, or developer-experience improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Affected component or area
      options:
        - New registry UI component
        - Existing registry UI component
        - Block
        - Theme Builder / tokens
        - CLI / installer
        - Documentation
        - Build / CI
        - Other
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Component name
      placeholder: e.g. button, command, telemetry-panel
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the product or developer need rather than only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior or API
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: Reference or reproduction URL
      placeholder: https://...
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility considerations
      description: Include keyboard, focus, contrast, motion, semantics, or dark-only constraints where relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This proposal is compatible with Neoncite/UI's intentional dark-only design constraint.
          required: true
        - label: I searched existing issues for similar requests.
          required: true
